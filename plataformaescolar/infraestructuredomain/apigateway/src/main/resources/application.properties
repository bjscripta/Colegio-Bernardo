spring.application.name=apigateway
server.port=8080

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

logging.level.org.springframework.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

spring.cloud.gateway.routes[0].id=estudiante-route
spring.cloud.gateway.routes[0].uri=lb://ESTUDIANTE-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/estudiante/**

spring.cloud.gateway.routes[1].id=asistencia-route
spring.cloud.gateway.routes[1].uri=lb://ASISTENCIA-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/asistencia/**

spring.cloud.gateway.routes[2].id=evaluacion-route
spring.cloud.gateway.routes[2].uri=lb://EVALUACION-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/evaluacion/**

spring.cloud.gateway.routes[3].id=bff-route
spring.cloud.gateway.routes[3].uri=lb://BFF-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/bff/**

spring.cloud.gateway.routes[4].id=clase-route
spring.cloud.gateway.routes[4].uri=lb://ASISTENCIA-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/clase/**

spring.cloud.gateway.routes[5].id=calificacion-route
spring.cloud.gateway.routes[5].uri=lb://EVALUACION-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/calificacion/**

spring.cloud.gateway.routes[6].id=keycloakadapter-route
spring.cloud.gateway.routes[6].uri=lb://KEYCLOAKADAPTER
spring.cloud.gateway.routes[6].predicates[0]=Path=/keycloakadapter/**
spring.cloud.gateway.routes[6].filters[0]=StripPrefix=1

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:3000,http://localhost:5173,http://localhost:5000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=false